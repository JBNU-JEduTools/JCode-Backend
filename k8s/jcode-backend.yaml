apiVersion: apps/v1
kind: Deployment
metadata:
  name: jcode-backend
  namespace: watcher
  labels:
    app: jcode-backend
spec:
  selector:
    matchLabels:
      app: jcode-backend
  template:
    metadata:
      labels:
        app: jcode-backend
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "2"
      imagePullSecrets:
      - name: watcher-harbor-registry-secret
      containers:
      - name: jcode-backend
        image: harbor.jbnu.ac.kr/jdevops/jcode-backend:REPLACE_WITH_COMMIT_SHA
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: TZ
          value: Asia/Seoul
        - name: SPRING_JACKSON_TIME_ZONE
          value: Asia/Seoul
        envFrom:
        - configMapRef:
            name: jcode-backend-config
        - secretRef:
            name: jcode-backend-secret
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: "1"
            memory: 1.5Gi
          limits:
            memory: 10Gi
        volumeMounts:
        - name: jcode-backend-tmp
          mountPath: /tmp
        - name: jcode-backend-logs
          mountPath: /logs
      volumes:
      - name: jcode-backend-tmp
        emptyDir: {}
      - name: jcode-backend-logs
        persistentVolumeClaim:
          claimName: jcode-backend-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jcode-backend
  namespace: watcher
  labels:
    app: jcode-backend
spec:
  selector:
    app: jcode-backend
  ports:
  - name: http-metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jcode-backend-logs-pvc
  namespace: watcher
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jcode-backend-monitor
  namespace: watcher
  labels:
    app: jcode-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: jcode-backend
  namespaceSelector:
    matchNames:
      - watcher
  endpoints:
    - port: http-metrics
      path: /actuator/prometheus  # Spring Actuator가 노출하는 엔드포인트
      interval: 30s
