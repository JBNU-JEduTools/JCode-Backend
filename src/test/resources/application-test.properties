spring.datasource.master.hikari.driver-class-name=org.h2.Driver
spring.datasource.master.hikari.jdbc-url=jdbc:h2:mem:jcode;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,YEAR
spring.datasource.master.hikari.username=sa
spring.datasource.master.hikari.password=
spring.datasource.replica.hikari.driver-class-name=org.h2.Driver
spring.datasource.replica.hikari.jdbc-url=jdbc:h2:mem:jcode;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,YEAR
spring.datasource.replica.hikari.username=sa
spring.datasource.replica.hikari.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

spring.data.redis.repositories.enabled=false
spring.session.store-type=none
redis.host=localhost
redis.port=6379
redis.password=

front.domain=http://frontend.test
router.domain=http://router.test
router.url=http://router.test/jcode/
watcher.url=http://watcher.test
spring.codec.max-in-memory-size=2MB
generator.bootstrap.url=http://generator-bootstrap.test
generator.workspace.url=http://generator-workspace.test
generator.auth.secret=0123456789abcdef0123456789abcdef
generator.auth.issuer=jcode-backend
generator.auth.audience=jcode-generator
generator.auth.subject=jcode-backend

spring.security.oauth2.client.registration.keycloak.client-id=test-client
spring.security.oauth2.client.registration.keycloak.client-secret=test-secret
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://keycloak.test/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak.test/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak.test/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak.test/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=email
keycloak.jwks-url=http://keycloak.test/certs
keycloak.logout.url=http://keycloak.test/logout

jwt.secret=0123456789abcdef0123456789abcdef
jwt.expire=600000
jwt.refresh.secret=abcdef0123456789abcdef0123456789
jwt.refresh.expire=21600000
jwt.cookie.domain=localhost
course.key.charset=ABCDEFGHIJKLMNOPQRSTUVWXYZ
course.lifecycle.initial-delay-ms=3600000
