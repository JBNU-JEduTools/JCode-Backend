name: PR checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
      - name: Validate MariaDB migrations
        run: scripts/test-migrations.sh
      - name: Validate Kubernetes DNS settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deployment = Path("k8s/jcode-backend.yaml").read_text(encoding="utf-8")
          config = Path("k8s/jcode-val-ex.yaml").read_text(encoding="utf-8")
          example = Path("src/main/resources/application-example.properties").read_text(encoding="utf-8")
          assert 'name: ndots\n          value: "2"' in deployment
          for service in ("jcode-bootstrap-svc", "jcode-generator-svc"):
              url = f"http://{service}:5000"
              assert url in config
              assert url in example
              assert f"{service}.watcher.svc.cluster.local" not in config
              assert f"{service}.watcher.svc.cluster.local" not in example
          PY
      - name: Validate assignment path backfill separation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          legacy_migration = Path("src/main/resources/db/migration/V7__add_assignment_lifecycle.sql").read_text()
          repair_migration = Path("src/main/resources/db/migration/V9__prepare_assignment_path_backfill.sql").read_text()
          job = Path("k8s/assignment-path-backfill-job.yaml").read_text()
          assert "INSERT INTO workspace_operation" in legacy_migration
          assert "ADD COLUMN IF NOT EXISTS path_backfill_status" in repair_migration
          assert "a.path_backfill_status = 'PENDING'" in repair_migration
          assert "MIGRATE_ASSIGNMENT_PATH" in repair_migration
          assert "ARCHIVE_FINAL_SUBMISSION" in repair_migration
          assert "workspace.assignment-path-backfill.enabled=true" in job
          assert "workspace.assignment-path-backfill.missing-namespace=archive" in job
          assert "app: jcode-assignment-path-backfill" in job
          PY
