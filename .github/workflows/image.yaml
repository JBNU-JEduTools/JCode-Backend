name: Backend image

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY || 'harbor.jedutools.io' }}
  IMAGE: ${{ vars.HARBOR_REGISTRY || 'harbor.jedutools.io' }}/jdevops/jcode-backend

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Harbor
        if: github.event_name == 'push'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$HARBOR_PASSWORD" | timeout 30 docker login "$HARBOR_REGISTRY" --username "$HARBOR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Build immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record digest
        run: echo '${{ env.IMAGE }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
